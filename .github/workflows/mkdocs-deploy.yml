name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and deploy docs
        run: uv run --group docs mkdocs gh-deploy --force --remote-branch gh-pages
